<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실사 — 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="../_shared/forms.css">
<link rel="stylesheet" href="count.css">
</head>
<body>
<div class="phone" id="root"></div>
<script src="../_shared/shared.js"></script>
<script src="../_shared/stock-data.js"></script>
<script src="count.js"></script>
<script>
// 시안 A: 먼저 셀 것(부족 · 만료) → 나머지 식자재 순 / B: 보관 위치별(냉장고 · 냉동고 · 상온 선반) — 식자재에 "보관 위치" 칸을 더한다
// 이동 틀 안에서는 재고 탭 위쪽 칩 "실사"로 들어온다(점주만)
const C = CNT;
ZW.switcher([
  ['시안', 'v', [['A', 'A 먼저 셀 것부터 (채택)'], ['B', 'B 보관 위치별']], C.variant],
  ['상태', 'state', C.STATES, C.state],
  ['화면', 'dark', [['0', '밝게'], ['1', '어둡게']], ZW.dark ? '1' : '0'],
], 'top:auto;bottom:160px');
const head = `<header class="top"><div class="store">모래내 베이커리 &amp; 델리</div><div class="row"><h1>${C.state === 'first' ? '처음 재고 넣기' : '실사'}</h1>
  <span class="small muted">${C.done.length}/${C.ROWS.length}</span></div></header>`;
const body = C.state === 'saved' ? C.saved()
  : `${C.basisBar()}${C.state === 'first' ? '<div class="banner info" style="margin:12px 0 0"><b>지금 있는 재료를 세어 넣어요</b>센 양이 기본 단가로 첫 로트가 돼요. 다 세지 않아도 돼요 — 안 센 재료는 재고 없이 시작하고, 마감에서 빼지도 부족으로 올리지도 않아요.</div>' : ''}
    ${C.variant === 'B' ? C.rowsB() : C.rowsA()}`;
document.getElementById('root').innerHTML = `${head}<main class="cnt">${body}</main>${C.state === 'saved' ? '' : `<div class="bottom"><div class="inner">${C.barInner()}</div></div>`}`;
C.wire(document);
</script>
</body>
</html>
