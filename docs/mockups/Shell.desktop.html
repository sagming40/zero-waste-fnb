<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 이동 (데스크톱) — 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { height: 100%; font-size: 14px; }
  .app { height: 100vh; display: grid; }
  .app.side { grid-template-columns: var(--sbw, 232px) 1fr; }
  .app.side.folded { grid-template-columns: 64px 1fr; }
  .app.side.dragging, .app.side.dragging * { cursor: col-resize !important; user-select: none; }
  .app.side.dragging iframe { pointer-events: none; } /* 끄는 중에 마우스가 화면(iframe) 안으로 빨려 들어가지 않게 */
  aside { position: relative; }
  /* 폭 조절 손잡이 — 메뉴 오른쪽 가장자리 */
  .grip { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 3; border: 0; padding: 0; background: transparent; }
  .grip:hover, .grip:focus-visible, .dragging .grip { background: var(--accent); opacity: .5; outline: none; }
  .fold { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--muted); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
  .fold:hover { background: var(--surface-2); }
  /* 접힌 상태: 아이콘만 */
  .folded aside { padding: 14px 8px; align-items: center; }
  .folded .lbl, .folded .grp, .folded .st, .folded .storepick small, .folded .me .lbl { display: none; }
  .folded .grp-sep { display: block; }
  .grp-sep { display: none; width: 24px; height: 1px; background: var(--line); margin: 8px 0; }
  .folded .item, .folded .cta, .folded .fold { justify-content: center; padding: 10px 0; }
  .folded .storepick { padding: 8px 0; text-align: center; }
  .folded .brand { padding: 4px 0 12px; }
  .app.top { grid-template-rows: auto 1fr; }
  .content { min-height: 0; overflow: auto; }
  .content iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* 왼쪽 메뉴 */
  aside { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; overflow: auto; }
  .brand { font-weight: 800; font-size: 16px; padding: 4px 10px 12px; }
  .storepick { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; font-size: 13px; }
  .storepick small { display: block; color: var(--muted); font-size: 11px; }
  .grp { font-size: 11px; font-weight: 700; color: var(--muted); padding: 12px 10px 4px; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; color: var(--text); }
  .item:hover { background: var(--surface-2); }
  .item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .item .st { margin-left: auto; font-size: 10px; color: var(--muted); }
  .cta { display: flex; align-items: center; gap: 8px; justify-content: center; width: 100%; border: 0; border-radius: 10px; padding: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; margin-bottom: 6px; }
  .me { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; border-top: 1px solid var(--line); }
  /* 위쪽 메뉴 */
  header.topnav { display: flex; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header.topnav .brand { padding: 0 12px 0 0; }
  .tn { position: relative; }
  .tn > button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--text); }
  .tn > button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .tn .dd { display: none; position: absolute; top: 100%; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 160px; z-index: 5; box-shadow: 0 6px 16px rgb(0 0 0 / .12); }
  .tn:hover .dd, .tn:focus-within .dd { display: block; }
  header.topnav .grow { flex: 1; }
  header.topnav .storepick { width: auto; margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script src="nav-data.js"></script>
<script>
const P = ZW.params;
const variant = (P.get('v') || 'A').toUpperCase();
const role = P.get('role') === 'staff' ? 'staff' : 'owner';
const time = P.get('time') === 'before' ? 'before' : 'after';
const common = `embed=1&palette=${ZW.paletteKey}&dark=${ZW.dark ? 1 : 0}`;
let cur = P.get('screen') || (role === 'owner' ? 'today' : 'closing');

ZW.switcher([
  ['이동', 'v', [['A', 'A 왼쪽 메뉴'], ['B', 'B 위쪽 메뉴']], variant],
  ['사람', 'role', [['owner', '점주'], ['staff', '직원']], role],
  ['때', 'time', [['before', '마감 전'], ['after', '마감 후']], time],
  ['화면', 'dark', [['0', '밝게'], ['1', '어둡게']], ZW.dark ? '1' : '0'],
], 'top:auto;bottom:8px');

const visible = NAV.SCREENS.filter(s => role === 'owner' || s.staff);
const groups = [...new Set(visible.map(s => s.group))];

function screenHtml(id) {
  if (id === 'today') return `<iframe title="오늘" src="${NAV.srcFor('today', 'desktop', `v=A&state=${time === 'before' ? 'before' : 'normal'}&${common}`)}"></iframe>`;
  if (id === 'closing') return `<iframe title="마감" src="${NAV.srcFor('closing', 'desktop', `v=A&state=${time === 'before' ? 'entry' : 'reentry'}&role=${role}&${common}`)}"></iframe>`;
  return NAV.placeholder(id);
}
const storePick = `<button class="storepick" title="매장 바꾸기">${NAV.icon('store', 18)}<span class="lbl"> 모래내 베이커리 &amp; 델리 ▾</span><small>${role === 'owner' ? '점주' : '직원'} · 매장 2곳</small></button>`;

/* ── 왼쪽 메뉴 폭 · 접힘: 사람마다 브라우저에 기억 (실패해도 기본값으로 돈다) ── */
const SB = { min: 180, max: 360, def: 232, snap: 120 };
let sb = { w: SB.def, folded: false };
try { Object.assign(sb, JSON.parse(localStorage.getItem('zw.sidebar') || '{}')); } catch (e) { /* 저장소를 못 쓰면 기본값 */ }
const saveSb = () => { try { localStorage.setItem('zw.sidebar', JSON.stringify(sb)); } catch (e) { /* 무시 */ } };
function applySb() {
  const app = document.getElementById('app');
  app.style.setProperty('--sbw', sb.w + 'px');
  app.classList.toggle('folded', sb.folded);
  const g = app.querySelector('.grip');
  if (g) { g.setAttribute('aria-valuenow', sb.folded ? 64 : sb.w); }
  const f = app.querySelector('.fold');
  if (f) { f.innerHTML = sb.folded ? '»' : '« <span class="lbl">메뉴 접기</span>'; f.title = sb.folded ? '메뉴 펴기' : '메뉴 접기'; f.setAttribute('aria-expanded', String(!sb.folded)); }
}

function render() {
  const app = document.getElementById('app');
  if (variant === 'B') {
    app.className = 'app top';
    const menus = groups.map(g => {
      const items = visible.filter(s => s.group === g);
      const on = items.some(s => s.id === cur);
      if (items.length === 1) return `<div class="tn"><button data-go="${items[0].id}" aria-current="${on ? 'page' : 'false'}">${items[0].label}</button></div>`;
      return `<div class="tn"><button aria-current="${on ? 'page' : 'false'}">${g} ▾</button><div class="dd">${items.map(s =>
        `<button class="item" data-go="${s.id}" aria-current="${s.id === cur ? 'page' : 'false'}">${NAV.icon(s.id, 18)}${s.label}</button>`).join('')}</div></div>`;
    }).join('');
    app.innerHTML = `<header class="topnav"><span class="brand">ZeroWaste F&amp;B</span>${menus}<span class="grow"></span>${storePick}</header><div class="content">${screenHtml(cur)}</div>`;
    return;
  }
  app.className = 'app side';
  const nav = groups.map((g, i) => `${i ? '<div class="grp-sep"></div>' : ''}<div class="grp">${g}</div>${visible.filter(s => s.group === g).map(s =>
    `<button class="item" data-go="${s.id}" title="${s.label}" aria-current="${s.id === cur ? 'page' : 'false'}">${NAV.icon(s.id, 18)}<span class="lbl">${s.label}</span>${s.src ? '' : `<span class="st">${s.stage}</span>`}</button>`).join('')}`).join('');
  const cta = time === 'before' && cur !== 'closing' ? `<button class="cta" data-go="closing" title="오늘 마감 입력">${NAV.icon('closing', 18)}<span class="lbl"> 오늘 마감 입력</span></button>` : '';
  app.innerHTML = `<aside aria-label="주 메뉴"><div class="brand">${sb.folded ? 'ZW' : 'ZeroWaste F&amp;B'}</div>${storePick}${cta}${nav}
    <div class="me"><button class="fold" data-act="fold"></button><span class="lbl">${role === 'owner' ? '김점주' : '박직원'} · 로그아웃</span></div>
    <button class="grip" role="separator" aria-orientation="vertical" aria-label="메뉴 폭 조절 (← → 키, 두 번 누르면 원래 폭)" aria-valuemin="${SB.min}" aria-valuemax="${SB.max}"></button></aside>
    <div class="content">${screenHtml(cur)}</div>`;
  applySb();
}

/* 폭 조절: 손잡이를 끈다. 너무 좁히면(120px 아래) 접힌다. 두 번 누르면 원래 폭 */
document.addEventListener('pointerdown', (e) => {
  const grip = e.target.closest('.grip');
  if (!grip) return;
  e.preventDefault();
  const app = document.getElementById('app');
  grip.setPointerCapture(e.pointerId);
  app.classList.add('dragging');
  const move = (ev) => {
    const x = ev.clientX;
    if (x < SB.snap) { sb.folded = true; }
    else { sb.folded = false; sb.w = Math.max(SB.min, Math.min(SB.max, Math.round(x))); }
    applySb();
    app.querySelector('.brand').textContent = sb.folded ? 'ZW' : 'ZeroWaste F&B';
  };
  const up = () => { app.classList.remove('dragging'); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); saveSb(); };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
});
document.addEventListener('dblclick', (e) => { if (e.target.closest('.grip')) { sb = { w: SB.def, folded: false }; saveSb(); render(); } });
document.addEventListener('keydown', (e) => {
  if (!e.target.closest || !e.target.closest('.grip')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    sb.folded = false;
    sb.w = Math.max(SB.min, Math.min(SB.max, sb.w + (e.key === 'ArrowRight' ? 16 : -16)));
    applySb(); saveSb();
  }
});
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-act="fold"]')) { sb.folded = !sb.folded; saveSb(); render(); return; }
  const g = e.target.closest('[data-go]'); if (g) { cur = g.dataset.go; render(); }
});
render();
</script>
</body>
</html>
