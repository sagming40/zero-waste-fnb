<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 매장 등록 · 매장 고르기 — 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="store.css">
</head>
<body>
<div class="phone">
  <main class="auth-m" style="padding-top:28px">
    <div id="brand"></div>
    <form id="box" class="authbox" novalidate style="margin-top:22px"></form>
  </main>
</div>
<script src="shared.js"></script>
<script src="auth.js"></script>
<script src="store.js"></script>
<script>
const S = STORE;
ZW.switcher([
  ['시안', 'v', [['A', 'A 한 화면'], ['B', 'B 3단계'], ['C', 'C 한 화면 + 질문형 (채택)']], S.variant],
  ['상태', 'state', S.STATES, S.state],
  ['화면', 'dark', [['0', '밝게'], ['1', '어둡게']], ZW.dark ? '1' : '0'],
], 'top:auto;bottom:8px');
document.getElementById('brand').innerHTML = AUTH.brand(true);
document.getElementById('box').innerHTML = S.body(S.state, S.variant);
S.wire(document);
</script>
</body>
</html>
