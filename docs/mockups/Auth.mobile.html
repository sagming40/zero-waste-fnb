<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 가입 — 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="phone">
  <main class="auth-m">
    <div id="brand"></div>
    <form id="box" class="authbox" novalidate></form>
  </main>
</div>
<script src="shared.js"></script>
<script src="auth.js"></script>
<script>
const A = AUTH;
ZW.switcher([
  ['시안', 'v', [['A', 'A 탭 (채택)'], ['B', 'B 이메일 먼저']], A.variant],
  ['상태', 'state', A.STATES, A.state],
  ['화면', 'dark', [['0', '밝게'], ['1', '어둡게']], ZW.dark ? '1' : '0'],
], 'top:auto;bottom:8px');
document.getElementById('brand').innerHTML = A.brand() +
  (A.state.startsWith('invite') ? '' : '<p class="tag">남은 빵이 얼마였는지, 오늘 마감부터 보여 드려요</p>');
const box = document.getElementById('box');
box.innerHTML = A.body(A.state, A.variant);
A.wire(document);
</script>
</body>
</html>
