# 🤖 GitHub에 사는 Test 대행인에게 주는 작업지시서
name: CI

# 언제 일하나: main에 push할 때 + PR이 열리거나 바뀔 때
on:
  push:
    branches: [main]
  pull_request:

# repo는 읽기만 한다 (Test만 돌리니 쓰기 권한은 필요 없다)
permissions:
  contents: read

# 같은 branch에 연달아 push하면 앞의 실행은 취소 (낡은 결과를 기다리지 않게)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest           # 빌려 쓰는 깨끗한 Linux 컴퓨터 (Docker 포함)
    timeout-minutes: 15              # 어딘가 멈추면 15분 뒤 강제 종료
    defaults:
      run:
        working-directory: backend   # 모든 run 명령은 backend/ 안에서

    steps:
      # 1. repo 받아 오기
      - uses: actions/checkout@v5

      # 2. JDK 25 설치 (build.gradle toolchain이 25를 요구한다)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # 3. Gradle 준비 + 의존성 cache (2번째 실행부터 download를 skip 한다)
      - uses: gradle/actions/setup-gradle@v5

      # 4. 본 작업: 전체 Test (Modulith 검사 + Testcontainers)
      - run: ./gradlew test

      # 5. 실패했을 때만 Test Report를 보관 → Actions 화면에서 내려받아 원인을 본다
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test

  # 🅰️ frontend 담당 ─ backend job과 다른 컴퓨터에서 동시에 돈다
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend  # 모든 run 명령은 frontend/ 안에서

    steps:
      # 1. repo 받아 오기
      - uses: actions/checkout@v5

      # 2. pnpm 설치 ─ frontend/package.json의 packageManager(pnpm@12.15.0)와 동일 버전
      #    cache: 받은 패키지를 다음 실행에 재사용한다 (잠금 파일이 바뀌면 새로 받는다)
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      # 3. Node 24 ─ 집 · 노트북 · 회사 PC와 같은 줄 (ARCHITECTURE 8.2)
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 4. 잠금 파일 그대로만 설치 ─ 어긋나면 여기서 실패
      - run: pnpm install --frozen-lockfile

      # 5. Test (Vitest, 한 번 돌고 끝)
      - run: pnpm test --watch=false

      # 6. 운영용 Build가 되는지 ─ TypeError · TemplateError는 여기서 잡힌다
      - run: pnpm build
